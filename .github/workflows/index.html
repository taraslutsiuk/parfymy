<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мерехтливий текст</title>
  <style>
    /* Базове оформлення сторінки */
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #111;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #fff;
    }

    /* Елемент з анімацією */
    .element {
      font-size: 2rem;
      letter-spacing: 0.5px;
      animation: simpleAnimation 5s infinite;
    }

    /* Ключові кадри анімації прозорості */
    @keyframes simpleAnimation {
      0%   { opacity: 0; }
      25%  { opacity: 0.4; }
      50%  { opacity: 0.8; }
      75%  { opacity: 0.4; }
      100% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="element">Мерехтливий текст</div>
</body>
</html>
